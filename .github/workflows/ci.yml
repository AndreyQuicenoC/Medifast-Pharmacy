name: CI Medifast Pharmacy

on:
  push:
    branches: [develop, main, "feat/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Escanear arbol de trabajo (sin historial Git)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact

  backend:
    needs: secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Configurar entorno de prueba
        run: |
          cp .env.example .env
          echo "USE_SQLITE=True" >> .env
          echo "DEBUG=True" >> .env
      - name: Django check y migraciones
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: pip-audit (dependencias)
        run: pip-audit -r requirements.txt
      - name: Tests backend
        run: |
          python manage.py test \
            apps.users.tests.test_settings_smoke \
            apps.users.tests.test_api_exception_handler \
            apps.users.tests.test_viewset_permissions

  frontend:
    needs: secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (alta severidad)
        run: npm audit --audit-level=high
      - name: Instalar navegadores Playwright
        run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
