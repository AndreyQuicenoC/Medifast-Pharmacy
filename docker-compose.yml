services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medifast_dev
      POSTGRES_USER: medifast
      POSTGRES_PASSWORD: medifast_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medifast -d medifast_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
