title = "Medifast gitleaks"

[extend]
useDefault = true

# Proyecto Django/React: reglas Ruby/Sidekiq generan falsos positivos en README y docs.
[[rules]]
id = "sidekiq-secret"
disabled = true

[[rules]]
id = "sidekiq-pro-secret"
disabled = true

[[rules]]
id = "rubygems-api-token"
disabled = true

[allowlist]
description = "Plantillas, dependencias, tests y placeholders documentados"
paths = [
  '''(^|/)frontend/node_modules''',
  '''node_modules''',
  '''(^|[\\/])backend[\\/]\.venv[\\/]''',
  '''(^|[\\/])\.venv[\\/]''',
  '''(^|/)backend/(env)/''',
  '''(^|/)backend/tests/''',
  '''docs/despliegue/acceso-produccion\.example\.md''',
  '''(^|/)backend/\.env\.example$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)frontend/\.env\.example$''',
  '''(^|/)backend/\.pytest_cache/''',
  '''(^|/)backend/\.venv/''',
]
regexes = [
  '''(?i)replace-with-''',
  '''(?i)your-[a-z-]+''',
  '''(?i)change-me-''',
  '''<[^>\n]{1,80}>''',
  '''TOKEN_PLACEHOLDER''',
]
